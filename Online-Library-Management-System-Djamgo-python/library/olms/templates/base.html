{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Library Management System</title>

  <!-- plugins:css -->
  <link rel="stylesheet" href="{% static 'assets/vendors/feather/feather.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}" />
  <!-- endinject -->

  <!-- Plugin css for this page -->
  <link rel="stylesheet" href="{% static 'assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}" />
  <link rel="stylesheet" type="text/css" href="{% static 'assets/js/select.dataTables.min.css' %}" />
  <!-- End plugin css for this page -->

  <!-- inject:css -->
  <link rel="stylesheet" href="{% static 'assets/css/vertical-layout-light/style.css' %}" />
  <!-- endinject -->

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #111827 30%, #1d4ed8 100%);
      color: #e2e8f0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .container-scroller {
      background: transparent;
    }

    .page-body-wrapper {
      padding-top: 18px;
    }

    .main-panel {
      background: rgba(15, 23, 42, 0.45);
      border-radius: 24px 0 0 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      min-height: calc(100vh - 90px);
      border-left: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(10px);
    }

    .content-wrapper {
      background: transparent;
      padding: 30px 28px 24px;
    }

    .navbar {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.35);
      width: 100%;
      z-index: 30;
    }

    .navbar-brand-wrapper {
      min-width: 260px;
      background: rgba(30, 41, 59, 0.9);
      border-right: 1px solid rgba(148,163,184,0.15);
    }

    .navbar-brand {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(14,165,233,0.12), rgba(99,102,241,0.18));
      border: 1px solid rgba(125, 211, 252, 0.25);
      color: #f8fafc !important;
      letter-spacing: 0.03em;
    }

    .navbar-brand img {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(59,130,246,0.35);
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .modern-header-title {
      margin: 0 20px 0 0;
      font-size: clamp(1.05rem, 2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #e0f2fe;
      text-shadow: 0 0 18px rgba(125, 211, 252, 0.25);
    }

    .sidebar {
      background: rgba(15, 23, 42, 0.88);
      border-right: 1px solid rgba(148,163,184,0.16);
      box-shadow: 18px 0 30px rgba(15, 23, 42, 0.2);
      min-height: calc(100vh - 70px);
      padding: 24px 16px 16px;
      position: sticky;
      top: 70px;
    }

    .sidebar .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar .nav-item {
      margin: 0;
    }

    .sidebar .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      color: #dbeafe;
      font-weight: 600;
      transition: all 0.25s ease;
      background: transparent;
      border: 1px solid transparent;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link[aria-expanded="true"] {
      background: linear-gradient(135deg, rgba(56,189,248,0.14), rgba(99,102,241,0.12));
      border-color: rgba(125,211,252,0.28);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(14,165,233,0.15);
      transform: translateX(2px);
    }

    .sidebar .menu-icon {
      font-size: 1.05rem;
      color: #7dd3fc;
      min-width: 20px;
    }

    .sidebar .menu-title {
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }

    .sidebar .nav-item .collapse .nav {
      gap: 6px;
      padding: 8px 0 0 18px;
    }

    .sidebar .sub-menu .nav-link {
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.35);
      border-radius: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .sidebar .sub-menu .nav-link:hover {
      background: linear-gradient(135deg, rgba(14,165,233,0.18), rgba(79,70,229,0.14));
      color: #fff;
    }

    .nav-profile .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(14,165,233,0.16), rgba(59,130,246,0.2));
      border: 1px solid rgba(125, 211, 252, 0.24);
    }

    .nav-profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.25);
    }

    .dropdown-menu {
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.93);
      box-shadow: 0 20px 30px rgba(15, 23, 42, 0.45);
      overflow: hidden;
    }

    .dropdown-item {
      color: #e2e8f0;
      padding: 0.8rem 1rem;
    }

    .dropdown-item:hover {
      background: rgba(59,130,246,0.15);
      color: #fff;
    }

    .alert {
      border: 0;
      border-radius: 14px;
      box-shadow: 0 12px 22px rgba(15, 23, 42, 0.18);
    }

    .card, .table, .form-wrapper, .card-body {
      background: rgba(15, 23, 42, 0.5) !important;
      border: 1px solid rgba(148, 163, 184, 0.16) !important;
      color: #e2e8f0 !important;
      border-radius: 18px !important;
    }

    .card-title, .card-header, h1, h2, h3, h4, h5, h6,
    .table th, .table td, .form-group label,
    .text-black, .text-dark {
      color: #f8fafc !important;
    }

    .btn {
      border-radius: 12px !important;
      padding: 0.7rem 1.2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #2563eb) !important;
      border: none !important;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #34d399, #10b981) !important;
      border: none !important;
    }

    .btn-danger {
      background: linear-gradient(135deg, #fb7185, #ef4444) !important;
      border: none !important;
    }

    @media (max-width: 991px) {
      .navbar-brand-wrapper {
        min-width: auto;
      }
      .modern-header-title {
        display: none;
      }
      .main-panel {
        border-radius: 18px 18px 0 0;
      }
    }
  </style>
</head>

<body>
  <div class="container-scroller">
    <!-- Navbar -->
    {% include 'includes/header.html' %}

    <div class="container-fluid page-body-wrapper">
      <!-- Sidebar -->
      {% include 'includes/sidebar.html' %}

      <div class="main-panel">
        <div class="content-wrapper">

          <!-- Display messages -->
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
            {% endfor %}
          {% endif %}

          {% block content %}
          {% endblock %}

        </div>
        <!-- Footer -->
        {% include 'includes/footer.html' %}
      </div>
    </div>
  </div>

  <!-- plugins:js -->
  <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
  <!-- endinject -->

  <!-- Plugin js for this page -->
  <script src="{% static 'assets/vendors/chart.js/Chart.min.js' %}"></script>
  <script src="{% static 'assets/vendors/datatables.net/jquery.dataTables.js' %}"></script>
  <script src="{% static 'assets/vendors/datatables.net-bs4/dataTables.bootstrap4.js' %}"></script>
  <script src="{% static 'assets/js/dataTables.select.min.js' %}"></script>
  <!-- End plugin js for this page -->

  <!-- inject:js -->
  <script src="{% static 'assets/js/off-canvas.js' %}"></script>
  <script src="{% static 'assets/js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'assets/js/template.js' %}"></script>
  <script src="{% static 'assets/js/settings.js' %}"></script>
  <script src="{% static 'assets/js/todolist.js' %}"></script>
  <!-- endinject -->

  <!-- Custom js for this page -->
  <script src="{% static 'assets/js/dashboard.js' %}"></script>
  <script src="{% static 'assets/js/Chart.roundedBarCharts.js' %}"></script>
  <!-- End custom js for this page -->
</body>

</html>
