{% extends 'base.html' %}
{% load static %}
{% block content %}
  <div class="row">
    <div class="col-12 grid-margin stretch-card">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Profile</h4>

          <form class="forms-sample" method="POST" action="{% url 'admin_profile_update' %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
              <label>Old Profile Pic</label><br>
              {% if user.profile_pic %}
                <img src="{{ user.profile_pic.url }}" height="150" width="150" alt="Profile Picture" />
              {% else %}
                <img src="{% static 'default_profile.png' %}" height="150" width="150" alt="Default Picture" />
              {% endif %}
            </div>

            <div class="form-group">
              <label>Profile Pic</label>
              <input type="file" class="form-control" name="profile_pic" />
            </div>

            <div class="form-group">
              <label>First Name</label>
              <input type="text" class="form-control" name="first_name" value="{{ user.first_name }}" />
            </div>

            <div class="form-group">
              <label>Last Name</label>
              <input type="text" class="form-control" name="last_name" value="{{ user.last_name }}" />
            </div>

            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" name="email" value="{{ user.email }}" />
            </div>

            <div class="form-group">
              <label>Username</label>
              <input type="text" class="form-control" readonly name="username" value="{{ user.username }}" />
            </div>

            <button type="submit" class="btn btn-primary mr-2">Submit</button>
          </form>

        </div>
      </div>
    </div>
  </div>
{% endblock %}
